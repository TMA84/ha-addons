configuration:
  printer_ip:
    name: Printer IP
    description: >-
      IP address of the Anycubic Kobra S1 on your network (on the printer: Settings → Network → turn on LAN mode).
      The page connects to it automatically and filament tracking starts right away.
      Leave empty to enter the address in the tool.
  mqtt_enabled:
    name: Home Assistant (MQTT)
    description: >-
      Report printer state, queue, remaining filament per ACE slot and “Clear the bed” to Home Assistant as entities
      (MQTT discovery). Needs an MQTT broker such as the Mosquitto add-on; credentials come from the Supervisor
      automatically. Without a broker it simply stays off.
  mqtt_control:
    name: Control from Home Assistant
    description: >-
      Buttons "Pause print" and "Resume print" as entities (e.g. for automations or the dashboard). Home Assistant then
      controls the printer – that's why it is off by default. Cancelling is never possible from Home Assistant.
  access_pin:
    name: Access PIN (direct port)
    description: >-
      PIN (4–32 characters) for direct access via port 8765 on your network. Leave empty for no protection.
      The sidebar (ingress) never asks for the PIN – Home Assistant's login protects it.
  allowed_hosts:
    name: Additional host names (direct port)
    description: >-
      Only needed if you open the direct port 8765 without a PIN through your own host name, e.g. behind a reverse
      proxy (printer.example.com). Comma-separated. IP addresses, names without a dot and home-network names
      (.local, .lan, .fritz.box, .home.arpa, .internal) always work; the sidebar (ingress) is not affected.
network:
  8765/tcp: Direct access without Home Assistant (optional)
